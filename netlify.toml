# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

# Never serve the module scripts stale: the app is small and loads them once.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The recordings never change under the same name; cache them for a year.
[[headers]]
  for = "/samples/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
